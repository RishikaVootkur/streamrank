name: streamrank

services:
  redis:
    image: redis:8.8.3-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: services/mlflow/Dockerfile
    image: streamrank-mlflow:local
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    volumes:
      - mlflow-artifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    image: streamrank-api:local
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CONNECTION_STRING: redis:6379
      LOG_LEVEL: INFO
    volumes:
      - ${ARTIFACTS_HOST_DIR:-./artifacts}/serving:/artifacts/serving:ro
      - ${DATA_HOST_DIR:-./data}/feast:/app/data/feast:ro
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      timeout: 5s
      retries: 60
    profiles: ["serving"]

  k6:
    image: grafana/k6:2.3.0
    volumes:
      - ./loadtest:/scripts:ro
      - ${ARTIFACTS_HOST_DIR:-./artifacts}/serving:/data
    environment:
      BASE_URL: http://api:8000
      RATE: ${LOAD_RATE:-100}
      DURATION: ${LOAD_DURATION:-2m}
    command: ["run", "/scripts/recommend.js"]
    depends_on:
      api:
        condition: service_healthy
    profiles: ["load"]

volumes:
  redis-data:
  postgres-data:
  mlflow-artifacts:
