[project]
name = "streamrank"
version = "0.1.0"
description = "Two-stage recommender with real-time features"
readme = "README.md"
license = "MIT"
authors = [{ name = "RishikaVootkur" }]
requires-python = ">=3.12,<3.13"
# Core runtime dependencies shared by every component.
dependencies = [
    "numpy>=2.5.3",
    "pandera[polars]>=0.33.1",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "scipy>=1.18.1",
]

[dependency-groups]
train = [
    "faiss-cpu>=1.15.1",
    "implicit>=0.7.3",
    "lightgbm>=4.7.0",
    "mlflow>=3.16.1",
    "onnx>=1.23.1",
    "onnxmltools>=1.16.0",
    "onnxscript>=0.7.2",
    "optuna>=5.0.0",
    "threadpoolctl>=3.7.0",
    "torch>=2.14.1",
]
serve = [
    "faiss-cpu>=1.15.1",
    "fastapi>=0.142.2",
    "feast[redis]>=0.66.0",
    "onnxruntime>=1.30.0",
    "opentelemetry-exporter-otlp-proto-http>=1.45.0",
    "opentelemetry-instrumentation-fastapi>=0.66b0",
    "opentelemetry-sdk>=1.45.0",
    "prometheus-client>=0.21,<0.25",
    "redis>=6.4,<8",
    "uvicorn>=0.54.0",
]
stream = [
    "quixstreams>=3.27.0",
    "redis>=6.4,<8",
]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=2.3,<2.4",
    "pre-commit>=4.6.2",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "redis>=6.4,<8",
    "ruff>=0.16.10",
    "scipy-stubs>=1.18.1.1",
]
spark = [
    "pyspark==4.2.0",
]
features = [
    "feast[duckdb,redis]>=0.66.0",
]
monitor = [
    "evidently>=0.7.23",
]
demo = [
    "redis>=6.4,<8",
    "streamlit>=1.65.0",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PTH", "PL", "NPY", "S"]
ignore = ["PLR0913", "S311"]  # S311: randomness here is for ML, never for security

[tool.ruff.lint.per-file-ignores]
"pipelines/spark/**" = ["N812"]  # `functions as F` is the PySpark convention
"src/streamrank/models/**" = ["N812"]  # `functional as F` is the PyTorch convention
"tests/**" = ["PLR2004", "NPY002", "S101", "S108", "S603", "S607"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "pipelines"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]  # FAISS and integration tests run in their own invocations
pythonpath = ["."]
markers = [
  "integration: needs the Docker Compose services running",
  "e2e: needs the full stack running",
]

[tool.coverage.run]
source = ["streamrank"]
branch = true
# Streamlit page glue; its logic lives in demo/view.py, which is tested.
omit = ["src/streamrank/demo/app.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[[tool.mypy.overrides]]
module = ["implicit.*", "onnxruntime.*", "onnxmltools.*", "confluent_kafka.*", "evidently.*"]
ignore_missing_imports = true
