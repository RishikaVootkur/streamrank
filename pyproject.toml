[project]
name = "streamrank"
version = "0.1.0"
description = "Two-stage recommender with real-time features"
readme = "README.md"
license = "MIT"
authors = [{ name = "RishikaVootkur" }]
requires-python = ">=3.12,<3.13"
# Core runtime dependencies shared by every component.
dependencies = [
    "numpy>=2.5.3",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[dependency-groups]
train = [
    "faiss-cpu>=1.15.1",
    "lightgbm>=4.7.0",
    "mlflow>=3.16.1",
    "optuna>=5.0.0",
    "torch>=2.14.1",
]
serve = [
    "fastapi>=0.142.2",
    "onnxruntime>=1.30.0",
    "prometheus-client>=0.26.0",
    "uvicorn>=0.54.0",
]
stream = [
    "quixstreams>=3.27.0",
    "redis>=8.1.0",
]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "psycopg[binary]>=3.3.6",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "redis>=8.1.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.11.32,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "N", "RUF", "PTH", "PL", "NPY", "S"]
ignore = ["PLR0913", "S311"]  # S311: randomness here is for ML, never for security

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "NPY002", "S101", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: needs the Docker Compose services running",
  "e2e: needs the full stack running",
]

[tool.coverage.run]
source = ["streamrank"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
